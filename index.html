<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap');
        </style>
        
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
    <div id="calculator">
        <h2>Olaoluwa Calculator</h2>
        <input type="text" id="display"></input>
        <div id="Buttos">
            <button value="1" onclick="displayvalue(value)">1</button>
            <button value="2" onclick="displayvalue(value)">2</button>
            <button value="3" onclick="displayvalue(value)">3</button>
            <button value="4" onclick="displayvalue(value)">4</button>
            <button value="5" onclick="displayvalue(value)">5</button>
            <button value="6" onclick="displayvalue(value)">6</button>
            <button value="7" onclick="displayvalue(value)">7</button>
            <button value="8" onclick="displayvalue(value)">8</button>
            <button value="9" onclick="displayvalue(value)">9</button>
            <button value="0" onclick="displayvalue(value)">0</button>
            <button value="." onclick="displayvalue(value)">.</button>
            <button value="=" onclick="equalvalue()">=</button>
            <button value="+" onclick="displayvalue(value)">+</button>
            <button value="-" onclick="displayvalue(value)">-</button>
            <button value="/" onclick="displayvalue(value)">/</button>
            <button value="*" onclick="displayvalue(value)">x</button>
            <button value="%" onclick="displayvalue(value)">%</button>
            <button value="clear" onclick="clearvalue()">C</button>
            <button value="delete" onclick="deletevalue()">Del</button>
            <button value="00" onclick="displayvalue(value)">00</button>
        </div>
    </div>
</body>
 <script src="next.js"></script>
</html>
